[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "beacon"
version = "0.1.0"
description = "Budgeted context assembly for LLM-based code repair."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Maintainers" }]
dependencies = [
  "openai>=1.30.0",
  "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10",
  "pytest>=9.0.3",
  "pytest-cov>=5.0",
  "ruff>=0.4.4",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
packages = ["cegraph"]
strict = true
