[extend]
useDefault = true

# Public native-tokenizer asset checksum, not a credential. Require both the
# exact result path and exact pinned SHA256; keep all default rules enabled.
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Pinned public Qwen tokenizer SHA256"
condition = "AND"
paths = ['''^examples/results/boltons-pilot/qwen05-summary\.json$''']
regexTarget = "secret"
regexes = ['''^c0382117ea329cdf097041132f6d735924b697924d6f6fc3945713e96ce87539$''']

# Verified SHA256 of public src/cegraph/tokens.py in frozen experiment records.
[[rules.allowlists]]
description = "Exact public token-counter source checksum"
condition = "AND"
paths = ['''^examples/results/edit-format-pilot/(qwen05|qwen15/interrupted)/protocol\.json$''']
regexTarget = "secret"
regexes = ['''^c88ff0b6a28376f1d84d17d0e81f43890149a9d3820e99e905838ab8e36311c4$''']
